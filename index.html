.small{font-size:.85rem;color:var(--muted)}.center{text-align:center}
b{font-weight:700}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hpig{width:44px;height:44px}.hpig svg{width:100%;height:100%}
.back{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:28px;line-height:1;cursor:pointer;padding-bottom:4px}
.htitle{flex:1;display:flex;flex-direction:column;line-height:1.15;min-width:0}.htitle b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.htitle span{font-size:.75rem;color:var(--muted)}
.htr{display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px}.htr b{font-family:Fredoka,sans-serif}
.tr-ic{width:24px;height:24px;vertical-align:-6px}
main{max-width:760px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:12px 0;border:1px solid var(--line)}
.card.narrow{max-width:420px;margin:30px auto}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.85rem;margin-bottom:8px}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0 4px;font-size:.9em}
/* Start */
.hero{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.bigpig{width:120px;height:124px;flex:0 0 auto;margin:0 auto}.bigpig svg{width:100%;height:100%}
.hero .bigpig{margin:0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.bubble:before{content:"";position:absolute;left:-10px;top:30px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.route{margin:8px 0 14px}
.routein{position:relative}
.road{position:absolute;left:0;top:0;width:84px}
.roadbed{fill:none;stroke:var(--road);stroke-width:30;stroke-linecap:round;vector-effect:non-scaling-stroke}
.roadline{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:9 9;vector-effect:non-scaling-stroke;opacity:.9}
.stop{position:absolute;left:0;right:0;height:78px;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;cursor:pointer;padding:0}
.stop .num{margin-left:6px}.stop.off .num{margin-left:30px}
.num{flex:0 0 auto;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font:600 1.3rem Fredoka,sans-serif;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:1}
.num.black{background:#1d1d1d;color:#fff}.num.gold{background:var(--gold);color:#1d1d1d}.num.red{background:var(--accent);color:#fff;font-size:1.2rem}.num.boss{background:#5b6270;color:#fff}
.num.sm{width:32px;height:32px;font-size:.95rem;border-width:2px;display:inline-grid;vertical-align:middle;margin-right:6px}
.stop .lab{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:7px 12px;display:flex;flex-direction:column;line-height:1.2;box-shadow:var(--shadow);min-width:0}
.stop .lab b{font-size:1rem}.stop .lab small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stop .lab em{font-style:normal;font-size:.82rem;color:var(--accent2);margin-top:2px}
.stop.done .lab{border-color:#e9c95a}.stop.done .lab em{color:#b07d00;letter-spacing:1px}
.stop.locked{opacity:.55}.stop.locked .num{filter:grayscale(1)}
.stop:active .lab{transform:scale(.98)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tool{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;box-shadow:var(--shadow);min-height:96px}
.tool .ti{font-size:1.6rem}.tool small{color:var(--muted);font-size:.8rem}
.foot{text-align:center;color:var(--muted);font-size:.72rem;margin-top:26px}
/* Knöpfe */
.btn{border:2px solid var(--line);background:var(--card2);border-radius:14px;padding:10px 16px;min-height:48px;cursor:pointer;font-size:1rem}
.btn.primary{background:var(--accent);border-color:var(--accent2);color:var(--btnink,#fff)}
.btn.big{font-size:1.1rem;padding:12px 22px}.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn.ok{background:var(--okbg);border-color:var(--ok)}.btn.danger{background:var(--badbg);border-color:var(--bad)}
.btn:disabled{opacity:.5}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.center .actions{justify-content:center}
/* Station */
.sthead{display:flex;gap:12px;align-items:center}.sthead h1{margin:0}.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.lk{display:inline-block;background:var(--hl);color:var(--ink);padding:2px 12px;border-radius:999px;font-size:1rem}
.learn p{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pname{font-weight:700;font-size:.9rem;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}.dots i.p{border-radius:3px}.dots i.did{background:var(--ok)}.dots i.cur{background:var(--accent);transform:scale(1.25)}
.task .q{font-size:1.2rem;margin:4px 0 10px}
.task.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.vis{margin:8px auto 12px;text-align:center}
.vis-rose svg{width:200px;max-width:70%}
.vis-map svg{width:100%;max-width:440px;height:auto}
.vis-sym svg{color:var(--ink)}
.vis-sight svg{width:220px;max-width:80%}
.vis-eagle svg{width:110px}.vis-flag svg{width:180px}
.profile,.timeline{width:100%;max-width:440px}
.pt{font:600 12px Fredoka,sans-serif;fill:var(--ink)}.ps{font:11px Andika,sans-serif;fill:var(--ink)}
.rose-t{font:600 20px Fredoka,sans-serif;fill:var(--ink)}
.rose .hit{cursor:pointer}@media (hover:hover){.rose .hit:hover circle{fill:var(--hl)}}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;text-align:left}
.lg{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:4px 8px;font-size:.9rem}.lg svg{color:var(--ink);flex:0 0 auto}
.ln{display:inline-block;width:40px;height:6px;border-radius:3px}.ln.blue{background:#3d8fd1}.ln.yellow{background:#f2c200}
.dot.red{display:inline-block;width:14px;height:14px;border-radius:50%;background:#dd2a2a;margin:0 13px}
.heights{display:grid;gap:4px;max-width:360px;text-align:left}
.hrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;font-size:.92rem}
.swatch{display:inline-block;width:30px;height:20px;border-radius:5px;border:1px solid var(--landline)}
.swatch.big{width:120px;height:70px;border-radius:12px}.swatch.sm{width:18px;height:14px;vertical-align:-2px;margin-right:6px}
.captable table{width:100%;border-collapse:collapse;font-size:.92rem;text-align:left}.captable td,.captable th{padding:4px 6px;border-bottom:1px solid var(--line)}
.vis-wappen svg{width:150px;height:auto}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;text-align:left}
.wcard{background:var(--card2);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}
.wcard svg{width:70px;height:auto;margin-bottom:4px}.wcard b{font-size:.92rem;line-height:1.2}.wcard span{font-size:.85rem;color:var(--accent2);font-weight:700}.wcard small{font-size:.75rem;color:var(--muted);line-height:1.25}
.opts.wopts .opt{padding:8px}.opts.wopts svg{width:78px;height:auto}
.mi.mwap{display:grid;place-items:center;padding:4px}.mi .mw svg{width:52px;height:auto;display:block}
.sights{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;text-align:left}
.sightcard{background:var(--card2);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:2px}.sightcard svg{width:100%;height:auto;border-radius:10px}.sightcard span{font-size:.82rem;color:var(--accent2)}.sightcard small{font-size:.78rem;color:var(--muted)}
/* Karten */
.map .st{fill:var(--land);stroke:var(--landline);stroke-width:.8;stroke-linejoin:round}
.map .st.hl{fill:var(--de);stroke:var(--ink);stroke-width:1.6}
.map .st.f-bad{fill:var(--badbg);stroke:var(--bad)}
.map.tappable .st,.map.tappable .co[data-hit]{cursor:pointer}
.map.tappable .st:hover{fill:var(--hl)}
.map .lake{fill:#6fb3e3}.map .river{fill:none;stroke:#3d8fd1;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.map .river.hlw{stroke:#0d5bd1;stroke-width:4.5}.map .lake.hlw{fill:#0d5bd1;stroke:#0d5bd1;stroke-width:3}
.map .city{fill:#dd2a2a;stroke:#fff;stroke-width:1.6}.map .cap{fill:var(--ink)}
.map .cl{font:700 13px Andika,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px}

.map .ml{font:600 12.5px Andika,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:2.5px}.map .ml.big{font-size:15px}.map .ml.tiny{font-size:9px}
.map .lead{stroke:var(--ink);stroke-width:.8}
.eumap .sea{fill:var(--sea)}.eumap .co{fill:var(--card2);stroke:var(--landline);stroke-width:.7}
.eumap .co.nb{fill:var(--nb)}.eumap .co.de{fill:var(--de);stroke:var(--ink);stroke-width:1.2}
.eumap .co.hl{fill:var(--accent);stroke:var(--ink);stroke-width:1.6}
.eumap.tappable .co[data-hit]:hover{filter:brightness(1.12)}
.eumap .seal{font:italic 600 17px Andika,sans-serif;fill:#2a6fb0}
.eumap .ml{font-size:16px}.eumap .ml.big{font-size:19px}.eumap .ml.tiny{font-size:11px}
/* Eingabe */
.ansrow{display:flex;justify-content:center}
.ans{width:100%;max-width:440px;font:600 1.45rem Andika,sans-serif;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);letter-spacing:.02em}
.ans:focus{outline:none;border-color:var(--accent)}
.ans.good{border-color:var(--ok);background:var(--okbg)}.ans.badf{border-color:var(--bad);background:var(--badbg)}
.ans.pin{letter-spacing:.5em;text-align:center;max-width:220px}
.umlauts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 0}
.key{min-width:46px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font:600 1.25rem Andika,sans-serif;cursor:pointer}
.key:active{background:var(--hl)}
.listans{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:10px;align-items:center}.ll{font-weight:700}
.lrow .ans{font-size:1.25rem;padding:9px 12px}
.opts{display:grid;gap:8px}.opts.symopts{grid-template-columns:repeat(4,1fr)}
.opt{border:3px solid var(--line);background:var(--card2);border-radius:14px;padding:12px;min-height:54px;font-size:1.05rem;cursor:pointer;text-align:left}
.symopts .opt{display:grid;place-items:center;color:var(--ink)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.sel{border-color:var(--accent);background:var(--hl)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:grid;gap:8px;align-content:start}
.mi{border:3px solid var(--line);background:var(--card2);border-radius:12px;padding:10px;min-height:50px;cursor:pointer;text-align:left;font-size:.98rem}
.mi.sel{border-color:var(--accent);background:var(--hl)}
.mi.paired.c0{border-color:#3d8be0;background:color-mix(in srgb,#3d8be0 18%,var(--card))}.mi.paired.c1{border-color:#9b5de5;background:color-mix(in srgb,#9b5de5 18%,var(--card))}
.mi.paired.c2{border-color:#f08a3c;background:color-mix(in srgb,#f08a3c 18%,var(--card))}.mi.paired.c3{border-color:#e8478c;background:color-mix(in srgb,#e8478c 18%,var(--card))}
.mi.locked{border-color:var(--ok)!important;background:var(--okbg)!important}
.seq{padding-left:1.6em;display:grid;gap:6px;margin:0 0 10px}.slot{min-height:46px}.slot.empty{color:var(--muted);border:2px dashed var(--line);border-radius:12px;padding:10px;list-style-position:outside}
.slot button{width:100%;text-align:left;border:2px solid var(--accent);background:var(--card);border-radius:12px;padding:10px;cursor:pointer}
.slot.locked button{border-color:var(--ok);background:var(--okbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:var(--card2);border-radius:999px;padding:10px 14px;cursor:pointer;min-height:46px}
.tf{display:grid;gap:8px}.tfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card2);border-radius:12px;padding:8px 10px}
.tfrow.locked{background:var(--okbg)}.tfrow.bad{background:var(--badbg)}
.tfb{display:flex;gap:6px}.tfb button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:44px}
.tfb button.on{border-color:var(--accent);background:var(--hl);font-weight:700}.tfb button.right{outline:3px solid var(--ok)}
.flagbuild{display:grid;gap:12px;justify-items:center}
.flagslots{width:220px;border:2px solid var(--landline);border-radius:6px;overflow:hidden;display:grid}
.fslot{height:52px;border:0;border-bottom:1px dashed var(--landline);cursor:pointer;color:var(--muted);font-size:.85rem}
.fslot span{background:rgba(255,255,255,.8);color:#222;border-radius:6px;padding:1px 6px}
.fslot.locked{cursor:default}
.colchip{display:flex;align-items:center}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:1rem}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}.fb.retry{background:var(--warnbg);border:2px solid #e2b13b}.fb.fail{background:var(--badbg);border:2px solid var(--bad)}
.fb .tip{display:block;margin-top:4px}.fb .ex{margin-top:6px}
.sol .solw{font:700 1.5rem Andika,sans-serif;letter-spacing:.04em;margin-top:4px}
.sol mark{background:#ffd34d;color:#222;border-radius:4px;padding:0 1px}
.sol s{color:var(--muted)}
/* Papier */
.paper{position:relative;background:repeating-linear-gradient(var(--card) 0 30px,var(--line) 30px 31px);border:2px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin:10px 0}
.paper .q{font-size:1.1rem;font-weight:700}
.pcode{display:inline-block;background:var(--ink);color:var(--card);font:600 .9rem Fredoka,sans-serif;border-radius:8px;padding:2px 10px}.pcode.sm{font-size:.75rem;padding:1px 6px}
.pstat{border-radius:10px;padding:8px 10px;margin-top:8px;font-weight:700}.pstat.ok{background:var(--okbg)}.pstat.wait{background:var(--warnbg)}.pstat.fix{background:var(--badbg)}
.note2{background:var(--warnbg);border-radius:8px;padding:6px 10px}
/* Abschluss */
.stamp{width:150px;height:150px;margin:6px auto;border:6px double var(--accent);border-radius:50%;display:grid;place-content:center;color:var(--accent);transform:rotate(-12deg);font-family:Fredoka,sans-serif}
.stamp span{font-size:3rem;line-height:1}.stamp small{font-size:.8rem;max-width:110px}
.stamp.pop{animation:stampin .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(2.4) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.starsbig{font-size:2.2rem;color:var(--gold);letter-spacing:4px}
.unlock{background:var(--sky);border-radius:14px;padding:12px;margin:12px 0}
.score{font-size:3.4rem;text-align:center;color:var(--accent)}.score small{font-size:1.2rem;color:var(--muted)}
.chklist{display:grid;gap:6px}.chkrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card2);border-radius:10px;padding:8px 10px;font-size:.92rem}
.tl{border-radius:999px;padding:3px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}.tl.g{background:#2b8f52;color:#fff}.tl.y{background:#f2c200;color:#222}.tl.r{background:#c93c3c;color:#fff}
.misslist{display:grid;gap:8px}.miss{background:var(--card2);border-radius:12px;padding:10px}
ul.clean{padding-left:1.2em}
/* Fehler-Kiste */
.bigemoji{font-size:3rem}
.fklist{display:grid;gap:6px;margin-top:10px}.fkitem{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
/* Merkheft */
details.merk{border:2px solid var(--line);border-radius:14px;margin:10px 0;padding:6px 12px;background:var(--card)}
details.merk summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none}details.merk summary::-webkit-details-marker{display:none}
details.merk summary small{font-weight:400;color:var(--muted)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;padding-bottom:8px}.word{background:var(--card2);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}.word small{color:var(--accent2)}
.flash{font-size:2.4rem;margin:18px 0 6px;letter-spacing:.03em}
.timerbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;max-width:300px;margin:10px auto}.timerbar i{display:block;height:100%;background:var(--accent);animation:tbar 3.2s linear forwards}
@keyframes tbar{from{width:100%}to{width:0}}
/* Checkliste */
.chk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.chkt{display:flex;gap:10px;align-items:flex-start}.chkt .sm{font-size:1.6rem;line-height:1}.chkt small{display:block;color:var(--muted);font-size:.8rem}
.self{display:flex;gap:4px}.self button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:1.3rem;cursor:pointer;filter:grayscale(.8);opacity:.6}
.self button.on{filter:none;opacity:1;border-color:var(--accent);background:var(--hl)}
/* Kleiderschrank */
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.witem{border:3px solid var(--line);background:var(--card2);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.witem.on{border-color:var(--accent);background:var(--hl)}.witem.locked{opacity:.55}.witem .wpig{width:80px;height:84px}.witem .wpig svg{width:100%;height:100%}.witem small{color:var(--muted);font-size:.78rem}
/* Eltern */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.tabs button{border:2px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 14px;cursor:pointer}.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pcheck{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--card2);border-radius:12px;padding:10px;margin:8px 0;font-size:.95rem}
.pcheck .pbtns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pcheck .key{background:var(--card);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:.88rem}
.pcheck .note{font-size:.95rem;margin-top:6px;padding:8px;max-width:none}
.pcheck.st-ok,.pcheck.st-okfix{opacity:.7}
.report{white-space:pre-wrap;background:var(--card2);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;max-height:420px;overflow:auto}
.printlist{display:grid;gap:8px}
.settings{display:grid;gap:10px}.settings label{display:grid;gap:4px;font-weight:700}.settings .ans{font-size:1.1rem}
.toggle{display:flex!important;gap:10px;align-items:center;font-weight:400!important}.toggle input{width:24px;height:24px}
/* Spiel */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.lvl{border:3px solid var(--line);background:var(--card2);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;min-height:100px}
.lvl .lnum{font:600 1.4rem Fredoka,sans-serif;color:var(--accent)}.lvl small{color:var(--muted)}.lvl.locked{opacity:.5}.lvl.boss{border-color:#5b6270}
.gamewrap{max-width:440px;margin:0 auto}
.gtitle{text-align:center;font-size:1.1rem;margin:4px 0 6px}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:2px solid var(--line);touch-action:none}
#cv{display:block;width:100%;height:auto;aspect-ratio:360/600;touch-action:none;user-select:none;-webkit-user-select:none}
.gpig{position:absolute;left:6px;bottom:2px;width:66px;height:68px;pointer-events:none}.gpig svg{width:100%;height:100%}
.gpig.hop{animation:hop .4s}
@keyframes hop{40%{transform:translateY(-12px) rotate(-6deg)}}
.gmsg{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);background:rgba(30,30,40,.82);color:#fff;border-radius:14px;padding:8px 14px;font-weight:700;text-align:center;opacity:0;pointer-events:none;max-width:85%}
.gmsg.show{animation:gm 2.2s}
@keyframes gm{10%,75%{opacity:1}100%{opacity:0}}
.gover{position:absolute;inset:0;background:rgba(20,18,15,.55);display:grid;place-items:center;padding:12px}
.gover[hidden]{display:none}
.ocard{background:var(--card);border-radius:18px;padding:16px;text-align:center;max-width:330px;max-height:96%;overflow:auto}
.ghud{display:flex;justify-content:space-between;gap:8px;margin:8px 2px;font-weight:700}
.gctrl{display:flex;justify-content:space-between;gap:10px}
.bossbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.wolfbox{width:84px;height:78px;flex:0 0 auto}.wolfbox svg{width:100%;height:100%}
.wolfbox.hurt{animation:shake .35s}.wolfbox.blow svg{transform:scale(1.08)}.wolfbox.defeated{transform:rotate(-14deg);opacity:.8}
.hp{flex:1}.hpl{display:flex;justify-content:space-between}.hpbar{height:16px;background:var(--line);border-radius:8px;overflow:hidden}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#c93c3c,#f08a3c);transition:width .4s}
.certificate{border:4px double var(--gold);border-radius:14px;padding:10px}.certificate .title{font:600 1.6rem Fredoka,sans-serif;color:var(--accent)}.certificate .crown{font-size:2rem}
.certificate .bigpig{width:90px;height:94px}
/* Modal, Toasts */
#modal{position:fixed;inset:0;z-index:50;background:rgba(20,18,15,.6);display:grid;place-items:center;padding:12px;overflow:auto}
#modal[hidden]{display:none}
.mcard{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:520px;box-shadow:var(--shadow)}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--ink);color:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:var(--shadow);animation:tin .3s;display:flex;align-items:center;gap:4px;text-align:center}
.toast.big{background:var(--accent);color:#fff;font-size:1.1rem;border-radius:16px}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
#storagebanner{background:var(--badbg);color:var(--ink);padding:8px 14px;font-size:.85rem;text-align:center}
#storagebanner[hidden]{display:none}
#print{display:none}
@media (max-width:420px){
  body{font-size:17px}main{padding:10px 12px 60px}.card{padding:14px}
  .hero .bigpig{width:92px;height:96px}
  .opts.symopts{grid-template-columns:repeat(2,1fr)}
  .lrow{grid-template-columns:1fr}
  .tfrow{grid-template-columns:1fr}
  .chk{grid-template-columns:1fr}.self{justify-content:flex-end}
  .match{gap:6px}.mi{font-size:.88rem;padding:8px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{
  body.printing .wappen,body.printing .pw svg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing #hdr,body.printing main,body.printing #toasts,body.printing #modal,body.printing #storagebanner{display:none!important}
  body.printing #print{display:block}
  body{background:#fff;color:#000}
  #print .ptitle{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:10px;font-size:14pt}
  #print .ptitle span{font-size:10pt}
  #print .map{width:100%;max-height:24cm}
  #print .printmap .st,#print .printmap .co{fill:#fff!important;stroke:#000!important;stroke-width:.9}
  #print .printmap .sea{fill:#fff!important}
  #print .printmap .co.de{stroke-width:2.2!important}
  #print .printmap .cap{fill:#000}
  #print h3{margin:12pt 0 4pt;font-size:12pt}
  #print .pq{margin:6pt 0 10pt;font-size:11pt;page-break-inside:avoid}
  #print .pwgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10pt 14pt}
  #print .pw{page-break-inside:avoid;text-align:center}#print .pw svg{width:2.6cm;height:auto}
  #print .pl{text-align:left;font-size:10pt;border-bottom:1px solid #777;height:18pt;margin-top:3pt;padding-top:6pt}
  #print .lines{height:60pt;background:repeating-linear-gradient(#fff 0 19pt,#999 19pt 20pt)}
  #print p{font-size:10.5pt}
}

    case 'ml': st.selL = st.selL === i ? null : i; if (st.pair[i] != null && st.selL === i) { delete st.pair[i]; } renderRunner(); return true;
    case 'mr': {

      if (owner != null) delete st.pair[owner];

    }
    case 'ord': if (st.seq.filter(x => x != null).length < t.items.length) { const free = firstFree(st); st.seq[free] = i; } renderRunner(); return true;
    case 'ordrm': { const p = +a.getAttribute('data-p'); st.seq[p] = undefined; st.seq = st.seq.map(x => x); renderRunner(); return true; }
    case 'tf': st.ans[i] = a.getAttribute('data-v') === '1'; renderRunner(); return true;
    case 'chip': { const c = +a.getAttribute('data-c'); const free = st.slots.findIndex(x => x == null); if (free >= 0) st.slots[free] = c; renderRunner(); return true; }
    case 'slot': if (!st.lock[i]) { st.slots[i] = null; renderRunner(); } return true;

}
function firstFree(st) { for (let p = 0; p < R.task.items.length; p++) if (st.seq[p] == null) return p; return st.seq.length; }

function onTap(code) {
  const t = R.task, st = R.st;

function submit() {

  $$('input.ans', R.opts.box()).forEach(inputChanged);
  switch (t.t) {
    case 'type': {
      if (!norm(st.val)) return shake();
      R.given.push(st.val);
      const r = checkAnswer(st.val, t.a, t.ci, t.wrong);
      if (r.near) R.near = R.near || r.near;
      if (r.ok) return succeed();
      return fail(r.msg || '');
    }
    case 'list': {
      const empty = st.vals.some((v, i) => !st.lock[i] && !norm(v));
      if (empty && !isExam()) return shake();
      R.given.push(st.vals.join(' | '));
      const used = [];
      st.lock.forEach((l, i) => { if (l && t.pool) { const r = checkPoolItem(st.vals[i], t.pool, [], t.ci); if (r.idx != null) used.push(r.idx); } });
      st.bad = []; let msgs = [];
      st.vals.forEach((v, i) => {

        if (t.slots) r = checkAnswer(v, t.slots[i][1], t.ci, t.wrong);
        else { r = checkPoolItem(v, t.pool, used, t.ci); if (!r.ok && t.wrong) { const w = checkAnswer(v, ['\u0000'], false, t.wrong); if (w.msg) r = w; } }
        if (r.ok) { st.lock[i] = !isExam(); if (r.idx != null) used.push(r.idx); }
        else { st.bad.push(i); if (r.msg && !msgs.includes(r.msg)) msgs.push(r.msg); if (r.near) R.near = R.near || r.near; }
      });
      if (!st.bad.length) return succeed();
      return fail(msgs.join(' '));
    }
    case 'choice': if (st.sel == null) return shake(); R.given.push(optName(t.o[st.sel])); return st.sel === t.c ? succeed() : fail('');
    case 'tap': if (st.sel == null) return shake(); R.given.push(t.map === 'de' ? (STATE[st.sel] || {}).n || st.sel : t.map === 'eu' ? (NB[st.sel] || {}).n || st.sel : DIRNAME[st.sel]); return st.sel === t.target ? succeed() : fail('');
    case 'match': {
      if (Object.keys(st.pair).length < t.pairs.length) return shake();
      R.given.push(Object.entries(st.pair).map(([l, r]) => (t.pairs[l][0][0] === '@' ? STATE[t.pairs[l][0].slice(1)].n : t.pairs[l][0]) + '=' + t.pairs[r][1]).join('; '));
      let wrong = 0;
      for (const [l, r] of Object.entries(st.pair)) { if (+l === +r) st.lock[l] = true; else { wrong++; if (!isExam()) delete st.pair[l]; } }
      if (!wrong) return succeed();
      return fail((t.pairs.length - wrong) + ' von ' + t.pairs.length + ' sind richtig. Verbinde den Rest neu.');
    }
    case 'order': {
      if (st.seq.filter(x => x != null).length < t.items.length) return shake();
      R.given.push(st.seq.map(i => t.items[i]).join(' → '));
      let wrong = 0;
      st.seq.forEach((it, p) => { if (it === p) st.lock[p] = true; else { wrong++; } });
      if (!wrong) return succeed();
      if (!isExam()) st.seq = st.seq.map((it, p) => (it === p ? it : undefined));
      return fail('Die grünen stimmen schon. Ordne den Rest neu.');
    }
    case 'tf': {
      if (st.ans.some(a => a == null)) return shake();
      R.given.push(st.ans.map(a => (a ? 'R' : 'F')).join(''));
      let wrong = 0;
      st.ans.forEach((a, i) => { if (a === t.items[i][1]) st.lock[i] = true; else { wrong++; if (!isExam()) st.ans[i] = null; } });
      if (!wrong) return succeed();
      return fail(wrong === 1 ? 'Ein Satz stimmt noch nicht. Lies ihn genau!' : wrong + ' Sätze stimmen noch nicht.');
    }
    case 'flag': {
      if (st.slots.some(x => x == null)) return shake();
      R.given.push(st.slots.map(c => FLAGCHIPS[c][0]).join('-'));
      const want = [0, 1, 2];
      let wrong = 0;
      st.slots.forEach((c, i) => { if (c === want[i]) st.lock[i] = true; else { wrong++; if (!isExam()) st.slots[i] = null; } });
      if (!wrong) return succeed();
      return fail('Denk an den Merkspruch: aus der Schwärze … durch blutige Schlachten … ans goldene Licht.');
    }
  }
}

function succeed() {

  /* ---------- Eingabe ---------- */
  function setAim(ev) {
    const cv = $('#cv'); const r = cv.getBoundingClientRect();
    const x = (ev.clientX - r.left) * W / r.width, y = (ev.clientY - r.top) * H / r.height;
    let a = Math.atan2(SY - y, x - SX);
    if (y > SY - 4) return;
    a = Math.max(.12, Math.min(Math.PI - .12, a));
    G.angle = a;
  }
  function bindCanvas() {
    const cv = $('#cv');
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr; cv._dpr = dpr;
    cv.addEventListener('pointerdown', (e) => { if (!G || G.over || G.paused) return; G.aiming = true; setAim(e); try { cv.setPointerCapture(e.pointerId); } catch (x) { } e.preventDefault(); });
    cv.addEventListener('pointermove', (e) => { if (!G || G.over || G.paused) return; if (G.aiming || e.pointerType === 'mouse') setAim(e); });
    cv.addEventListener('pointerup', (e) => { if (!G || !G.aiming) return; G.aiming = false; setAim(e); fire(); });
    cv.addEventListener('pointercancel', () => { if (G) G.aiming = false; });
  }
  function hud() {
    const el = $('#ghud'); if (!el || !G) return;
    const left = G.dropEvery - G.miss;
    el.innerHTML = '<span>⭐ ' + G.score + '</span><span title="Schüsse bis die ' + (G.mode === 'boss' ? 'Wolf pustet' : 'Decke rutscht') + '">' + (G.mode === 'boss' ? '🌬️ ' : '⬇️ ') + '●'.repeat(left) + '○'.repeat(Math.max(0, G.dropEvery - left)) + '</span><span>❓ ' + G.clueOk + '/' + G.clueAll + '</span>';
  }

  /* ---------- Ansichten ---------- */
  function viewSelect() {
    const k = todayKey(); const today = S.game.day === k ? S.game.dayTr : 0;
    let h = '<section class="card"><h1>🫧 Blubber-Blasen</h1><p>Ziele mit Fritzis Blasen-Kanone: <b>3 gleiche Farben</b> platzen. Triffst du eine goldene <b>❓-Blase</b>, kommt ein Rätsel. Richtig gelöst = <b>Joker-</b> oder <b>Bomben-Blase</b>!</p><p class="small">Jede geschaffte Station schaltet ein Level frei. Heute im Spiel verdient: ' + today + '/15 ' + ART.truffle + '</p><div class="levels">';
    for (const s of STATIONS) {
      const un = levelUnlocked(s.id); const rec = S.game.lv[s.id];
      h += '<button class="lvl' + (un ? '' : ' locked') + '" data-act="glevel" data-i="' + s.id + '"><span class="lnum">' + s.id + '</span><b>' + s.name + '</b><small>' + (un ? (rec && rec.stars ? '★'.repeat(rec.stars) + '☆'.repeat(3 - rec.stars) : 'Neu!') : '🔒 Station ' + s.id) + '</small></button>';
    }
    h += '<button class="lvl boss' + (bossUnlocked() ? '' : ' locked') + '" data-act="boss"><span class="lnum">🐺</span><b>Endgegner</b><small>' + (bossUnlocked() ? (S.game.boss.wins ? '🏆 besiegt' : 'Wolf Wirrwarr') : '🔒 nach der Probe-Arbeit') + '</small></button>';
    h += '</div></section>';
    app().innerHTML = h;
  }
  function stageHTML(title, boss) {
    return '<section class="gamewrap"><div class="gtitle">' + title + '</div>' +
      (boss ? '<div class="bossbar"><div id="wolf" class="wolfbox grin">' + ART.wolf('grin') + '</div><div class="hp"><div class="hpl"><b>Wolf Wirrwarr</b><span><span id="hpnum">100</span> ❤</span></div><div id="hpbar" class="hpbar"><i style="width:100%"></i></div></div></div>' : '') +
      '<div class="stage"><canvas id="cv" aria-label="Spielfeld: tippen und ziehen zum Zielen, loslassen zum Schießen"></canvas><div id="gpig" class="gpig">' + ART.pig({ wear: S.wear }) + '</div><div id="gmsg" class="gmsg"></div><div id="gover" class="gover" hidden></div></div>' +
      '<div id="ghud" class="ghud"></div><div class="gctrl"><button class="btn" data-act="gswap">↻ Tauschen</button><button class="btn" data-act="' + (boss ? 'home' : 'game') + '">Beenden</button></div>' +
      '<p class="small center">Ziehen zum Zielen, loslassen zum Schießen. Die rote Linie darf nicht erreicht werden.</p></section>';
  }
  function start(mode, level) {
    stop();
    setup(mode, level);
    bindCanvas(); hud();
    last = performance.now();
    raf = requestAnimationFrame(loop);
    if (mode === 'boss') { S.game.boss.tries++; save(); toastGame('Wolf Wirrwarr hat alle Wegweiser durcheinandergepustet! Besiege ihn!'); }
  }
  function viewPlay(k) {
    if (!levelUnlocked(k)) { toast('🔒 Schaffe zuerst Station ' + k + '.'); return viewSelect(); }
    app().innerHTML = stageHTML('Level ' + k + ' · ' + stationById(k).name, false);
    start('level', k);
  }
  function viewBoss() {
    if (!bossUnlocked()) { toast('🔒 Mach zuerst die Probe-Arbeit.'); ui.view = 'home'; return render(); }
    app().innerHTML = stageHTML('Endgegner am Brandenburger Tor', true);
    start('boss');
  }
  function stop() { cancelAnimationFrame(raf); raf = 0; if (G) G.over = true; G = null; const m = $('#modal'); if (m && !m.hidden && $('#cluebox')) { m.hidden = true; m.innerHTML = ''; } }
  function onClick(e) {
    const a = e.target.closest('[data-act]'); if (!a) return false;
    const act = a.getAttribute('data-act');
    if (act === 'gswap') { if (G && !G.shot && !G.over && !G.paused) { const t = G.cur; G.cur = G.next; G.next = t; } return true; }
    if (act === 'glevel') { const k = +a.getAttribute('data-i'); if (!levelUnlocked(k)) { toast('🔒 Schaffe zuerst Station ' + k + '.'); return true; } go('play', { level: k }); return true; }
    if (act === 'gagain') { go('play', { level: G ? G.level : ui.level }); return true; }
    if (act === 'bossagain') { go('boss'); return true; }
    return false;
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.paused && !G.over) { G.aiming = false; } });
  function sim(angle) {
    let x = SX, y = SY, vx = Math.cos(angle), vy = -Math.sin(angle);
    for (let n = 0; n < 400; n++) { x += vx * 4; y += vy * 4; if (x < BR) { x = BR; vx = -vx; } if (x > W - BR) { x = W - BR; vx = -vx; } if (collides(x, y)) break; }
    const ri = Math.max(0, Math.round((y - G.top - BR) / RH)); let best = null;
    for (let i = Math.max(0, ri - 1); i <= ri + 1; i++) for (let c = 0; c < rowLen(i); c++) { if (get(i, c)) continue; const [bx, by] = cellXY(i, c); const d = (bx - x) ** 2 + (by - y) ** 2; const att = i === 0 || neigh(i, c).some(([j, k]) => get(j, k)); if (att && (!best || d < best.d)) best = { i, c, d }; }
    if (!best || best.i >= G.rows.length) return 0;
    const row = G.rows[best.i]; row[best.c] = { col: G.cur.col, kind: 'n' }; const n = cluster(best.i, best.c, G.cur.col).length; row[best.c] = null; return n;
  }
  return { viewSelect, viewPlay, viewBoss, stop, onClick, _state: () => G, _sim: sim, _fire: fire, _setAngle: (a) => { if (G) G.angle = a; } };
})();
window.GAME = GAME;

;
/* Start */
'use strict';
function init() {
  load();
  if (!storageOK) showStorageBanner();
  const keyDown = (e) => { const k = e.target.closest && e.target.closest('[data-ins]'); if (k) { e.preventDefault(); if (e.type === 'pointerdown') insertChar(k.getAttribute('data-ins')); } };
  document.addEventListener('pointerdown', keyDown, true);
  document.addEventListener('mousedown', keyDown, true);
  document.addEventListener('click', (e) => { touchActivity(); onClick(e); });
  document.addEventListener('focusin', (e) => { if (e.target.matches && e.target.matches('input.ans')) lastInput = e.target; });
  document.addEventListener('input', (e) => { if (e.target.matches && e.target.matches('input.ans')) inputChanged(e.target); });
  document.addEventListener('keydown', (e) => {
    touchActivity();
    if (e.key !== 'Enter') return;
    if (R && finished() && !(e.target.closest && e.target.closest('button,input,textarea'))) { const b = $('[data-act="next"]'); if (b) { e.preventDefault(); b.click(); } return; }
    if (e.target.id === 'pin') { const b = $('[data-act="pinok"]'); if (b) b.click(); return; }
    if (R && e.target.matches && e.target.matches('input.ans')) {
      e.preventDefault();
      if (finished()) { const b = $('[data-act="next"]'); if (b) b.click(); } else { submit(); if (R && finished()) { const nb = $('[data-act="next"]'); if (nb) setTimeout(() => { try { nb.focus({ preventScroll: true }); } catch (x) { } }, 20); } }
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'unlockall') { S.unlockAll = e.target.checked; save(); }
    if (e.target.id === 'sound') { S.sound = e.target.checked; save(); }
  });
  window.addEventListener('pagehide', () => save(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
  render();
}
init();
